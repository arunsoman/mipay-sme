# FAPI 2.0 Edge TLS configuration for the host nginx (mipay-sme server block)
# This file should be included in the server block that terminates TLS for
# auth.afriqpay.com, api.afriqpay.com, admin.afriqpay.com, and any other
# portal hosts served by this gateway.

# Allow TLS 1.2 and 1.3, but only the FAPI‑approved cipher suites for 1.2:
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;

# FAPI 2.0 permitted TLS 1.2 cipher suites (RFC 9142 §10)
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

# ECDH curve selection (FAPI recommends X25519 or P‑256 / P‑384)
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# HSTS – add once the whole afriqpay.com zone is HTTPS‑only
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Optional: add OCSP stapling if the certificates support it
# ssl_stapling on;
# ssl_stapling_verify on;

# Ensure the host only accepts the expected portal hosts (defense‑in‑depth)
# server_name auth.afriqpay.com api.afriqpay.com admin.afriqpay.com;

# Setup tokens can arrive in the query string. This server-level snippet disables
# the host's default combined access log, which records the full request URI.
# To keep access logs, define a format in nginx's http block using $uri (not
# $request or $request_uri), and select it in the host server block.
access_log off;
