# The portal builder (widget workbench) as a hosted site: portalbuilder.afriqpay.com.
# Static only. The host nginx in front of it checks the builder users' passwords (basic auth) and
# proxies /internal/ui/builder/** to the backend with the user name and the builder key.
server {
  listen 80;

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
