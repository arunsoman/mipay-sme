# Admin portal static SPA; every /api call is routed through the platform
# api-gw (trustplane gateway) on the shared mesh, vhost portal.fapi.local.
server {
  listen 80;

  # re-resolve gateway/service names whenever containers restart (docker DNS)
  resolver 127.0.0.11 valid=5s ipv6=off;

  # gateway is the single policy point; it forwards to the MiPay upstream.
  location /api/ {
    set $gw_upstream https://gateway:8443;
    proxy_pass $gw_upstream;
    proxy_ssl_server_name on;
    proxy_ssl_name portal.fapi.local;   # matches the gateway route table vhost
    proxy_ssl_verify off;               # mesh-internal hop (CA not mounted here)
    proxy_set_header Host portal.fapi.local;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    proxy_pass_request_headers on;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
