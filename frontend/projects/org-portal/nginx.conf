log_format portal_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

# Org portal (manufacturer / distributor / supplier) static SPA; every /api call is routed through the platform
# api-gw (trustplane gateway) on the shared mesh, vhost portal.fapi.local.
server {
  listen 80;
  access_log /var/log/nginx/access.log portal_safe;

  # re-resolve gateway/service names whenever containers restart (docker DNS)
  resolver 127.0.0.11 valid=5s ipv6=off;

  # gateway is the single policy point; it forwards to the MiPay upstream.
  location /api/ {
    set $gw_upstream https://gateway:8443;
    proxy_pass $gw_upstream;
    proxy_ssl_server_name on;
    proxy_ssl_name portal.fapi.local;   # matches the gateway route table vhost
    proxy_ssl_verify off;               # mesh-internal hop (CA not mounted here)
    proxy_set_header Host portal.fapi.local;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    proxy_pass_request_headers on;
  }

  # the app shell is never cached: a deploy (or a published layout's new screens) reaches the
  # browser on its next load. The hashed bundles it names change with every build.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
