log_format portal_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  access_log /var/log/nginx/access.log portal_safe;

  # re-resolve the backend service name whenever it restarts (docker DNS)
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $backend_upstream http://backend:8080;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location /auth/ {
    proxy_pass https://127.0.0.1:19120;
    proxy_ssl_server_name on;
    proxy_ssl_name portal.fapi.local;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
