# portalbuilder.afriqpay.com: the portal builder (docs/plans/portal-builder.md steps 5 + 7).
# Install: /etc/nginx/sites-available/portalbuilder (+ sites-enabled link), with __BUILDER_KEY__
# replaced by UI_BUILDER_KEY from the mipay .env. The file then holds a secret: chmod 600, root.
# Users: /etc/nginx/portalbuilder.htpasswd (htpasswd -B). Maker/checker compares these user names.
server {
  listen 80;
  server_name portalbuilder.afriqpay.com;
  location /.well-known/acme-challenge/ { root /var/www/afriq-platform; }   # certbot webroot, as for the other hosts
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;   # nginx 1.24 on the host: no separate http2 directive
  server_name portalbuilder.afriqpay.com;
  ssl_certificate     /etc/letsencrypt/live/portalbuilder.afriqpay.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/portalbuilder.afriqpay.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  client_max_body_size 1m;

  auth_basic "MiPay portal builder";
  auth_basic_user_file /etc/nginx/portalbuilder.htpasswd;

  # the builder API: the backend trusts only this hop (builder key) and the user nginx checked
  location /internal/ui/builder/ {
    proxy_pass http://127.0.0.1:19110;
    proxy_set_header X-Builder-User $remote_user;
    proxy_set_header X-Builder-Key "__BUILDER_KEY__";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # nothing else of the backend is reachable from this site
  location /internal/ { return 404; }
  location /api/ { return 404; }

  location / {
    proxy_pass http://127.0.0.1:19115;
    proxy_set_header Host $host;
  }
}
