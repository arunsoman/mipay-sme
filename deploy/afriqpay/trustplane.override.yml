# Trust plane on the afriqpay host, layered over ../../trustplane/docker-compose.yml:
#   docker compose -p trustplane -f ../../trustplane/docker-compose.yml -f trustplane.override.yml up -d --build
# The gateway is the single policy point for every /api call (route allowlist, per-IP rate
# limits with the real client IP via limits.trusted_proxies, body limits, request ids).
# It is published on loopback only; the host nginx terminates public TLS and forwards
# /api/* to it with Host: portal.fapi.local. IdP and RBAC stay on internal networks.
services:
  gateway:
    ports: !override
      - "127.0.0.1:19120:8443"
    restart: unless-stopped
  idp:
    restart: unless-stopped
    environment:
      # Cut-over P0.3: still a sandbox deployment (demo seed users, internal issuer).
      # Moving to production needs DNS + a certificate for auth.afriqpay.com and its nginx
      # vhost first; then set IDP_ENVIRONMENT=production, IDP_ISSUER=https://auth.afriqpay.com
      # and remove IDP_SEED_USERS (the IdP refuses to start otherwise).
      IDP_ENVIRONMENT: sandbox
  rbac:
    restart: unless-stopped
  pg:
    restart: unless-stopped
