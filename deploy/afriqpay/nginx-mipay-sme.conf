# MiPay SME portals (deploy/afriqpay). Installed as /etc/nginx/sites-available/mipay-sme.
# Replaces afriq-new-domains (manufacturer./b2b.) and afriq-platform-mipay (mipay.), whose
# originals are kept under /etc/nginx/backup-mipay-sme/.

# ---------- HTTP: ACME challenges + redirect everything to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name admin.afriqpay.com manufacturer.afriqpay.com distributor.afriqpay.com supplier.afriqpay.com mipay.afriqpay.com b2b.afriqpay.com;
  location ^~ /.well-known/acme-challenge/ { root /var/www/afriq-platform; }
  location / { return 301 https://$host$request_uri; }
}

# ---------- mipay.afriqpay.com -> admin portal
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name mipay.afriqpay.com;
  ssl_certificate     /etc/letsencrypt/live/mipay.afriqpay.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mipay.afriqpay.com/privkey.pem;
  return 301 https://admin.afriqpay.com$request_uri;
}

# ---------- b2b.afriqpay.com (old distributor portal name) -> distributor portal
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name b2b.afriqpay.com;
  ssl_certificate     /etc/letsencrypt/live/manufacturer.afriqpay.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/manufacturer.afriqpay.com/privkey.pem;
  return 301 https://distributor.afriqpay.com$request_uri;
}

# ---------- shared proxy settings for the four portals
#   /api/  -> trustplane gateway (127.0.0.1:19120) -> backend
#   /      -> the portal's static app (one container per portal)

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name admin.afriqpay.com;
  ssl_certificate     /etc/letsencrypt/live/mipay-sme-portals/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mipay-sme-portals/privkey.pem;
  client_max_body_size 2m;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /actuator { return 404; }
  location /api/ {
    # every API call goes through the trustplane gateway (allowlist, rate limits, body limits)
    proxy_pass https://127.0.0.1:19120;
    proxy_ssl_server_name on;
    proxy_ssl_name portal.fapi.local;      # the gateway's route-table vhost
    proxy_ssl_verify off;                  # loopback hop to the gateway's internal-CA cert
    proxy_set_header Host portal.fapi.local;
    proxy_set_header X-Real-IP $remote_addr;      # trusted by the gateway (limits.trusted_proxies)
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
  location / { proxy_pass http://127.0.0.1:19111; proxy_set_header Host $host; }
}

