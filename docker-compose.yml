services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mipay
      POSTGRES_USER: mipay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mipay}
    ports: ["5432:5432"]
    # minimal footprint: ~35 MB idle; small shared_buffers so it fits the limit
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=2MB"]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mipay -d mipay"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    networks:
      default:
        aliases: [backend]
      sme-mesh:
        aliases: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --timeout=3 http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s        # a single CPU makes Spring Boot start slower
    mem_limit: 768m
    cpus: 1.0
    environment:
      # heap sized from the container limit; serial GC + small thread stacks for a 1-CPU box
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -Xss512k -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=192m"
      SPRING_PROFILES_ACTIVE: postgres
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-sandbox}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-sandbox-jwt-secret-change-me-in-production-0123456789}
      POSTGRES_URL: jdbc:postgresql://db:5432/mipay
      POSTGRES_USER: mipay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mipay}
      APP_RBAC_REGISTRY_URL: https://rbac:8443/rbac/internal/permissions/register
      APP_RBAC_URL: https://rbac:8443
    volumes:
      - trustplane-pki:/pki:ro            # mipay-mesh client cert + platform CA (trustplane pki-init)
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    mem_limit: 32m
    cpus: 0.25
  admin-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
    ports: ["4201:80"]
    mem_limit: 32m
    cpus: 0.25
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      sme-mesh:
    restart: unless-stopped

  manufacturer-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.portal
      args:
        PORTAL: manufacturer
    ports: ["4202:80"]
    mem_limit: 32m
    cpus: 0.25
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      sme-mesh:
    restart: unless-stopped
  distributor-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.portal
      args:
        PORTAL: distributor
    ports: ["4203:80"]
    mem_limit: 32m
    cpus: 0.25
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      sme-mesh:
    restart: unless-stopped
  supplier-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.portal
      args:
        PORTAL: supplier
    ports: ["4204:80"]
    mem_limit: 32m
    cpus: 0.25
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      sme-mesh:
    restart: unless-stopped

networks:
  sme-mesh:
    external: true

volumes:
  trustplane-pki:
    external: true
    name: trustplane_pki                 # created by the trustplane stack (pki-init)
