spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mipay}
    username: ${POSTGRES_USER:mipay}
    password: ${POSTGRES_PASSWORD:mipay}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/fresh

app:
  environment: ${APP_ENVIRONMENT:sandbox}
  jwt-secret: ${APP_JWT_SECRET:sandbox-jwt-secret-change-me-in-production-0123456789}
  dev-otp: "123456"
