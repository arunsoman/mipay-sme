name: Build release images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            build_args: ''
          - name: admin-portal
            context: frontend
            dockerfile: frontend/Dockerfile.admin
            build_args: ''
          - name: manufacturer-portal
            context: frontend
            dockerfile: frontend/Dockerfile.portal
            build_args: PORTAL=manufacturer
          - name: distributor-portal
            context: frontend
            dockerfile: frontend/Dockerfile.portal
            build_args: PORTAL=distributor
          - name: supplier-portal
            context: frontend
            dockerfile: frontend/Dockerfile.portal
            build_args: PORTAL=supplier
          - name: gateway
            context: trustplane
            dockerfile: trustplane/docker/Dockerfile
            build_args: SERVICE=gateway
          - name: idp
            context: trustplane
            dockerfile: trustplane/docker/Dockerfile
            build_args: SERVICE=idp
          - name: rbac
            context: trustplane
            dockerfile: trustplane/docker/Dockerfile.java
            build_args: MODULE=rbac-service
          - name: comms
            context: trustplane
            dockerfile: trustplane/docker/Dockerfile.java
            build_args: MODULE=comms-service
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          pull: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Sign build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record image digest
        run: echo 'ghcr.io/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
