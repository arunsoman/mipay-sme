name: RBAC integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rbac-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbac-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-dev
          POSTGRES_DB: rbac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d rbac_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: trustplane/java/**/*.gradle.kts
      - name: Run database-backed RBAC tests
        working-directory: trustplane/java
        env:
          TEST_RBAC_DSN: postgres://platform:platform-dev@127.0.0.1:5432/rbac_test?sslmode=disable
          REQUIRE_RBAC_DSN: 'true'
        run: ./gradlew :rbac-service:test --no-configuration-cache --rerun-tasks
      - name: Reject skipped or missing tests
        run: python3 trustplane/scripts/assert-no-skipped-junit.py trustplane/java/rbac-service/build/test-results/test
