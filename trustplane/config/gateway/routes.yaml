    rate: {ip_per_min: 60}
    body_limit: 16384
  - host: portal.fapi.local
    path: /api/env
    methods: [GET]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60}
  - host: portal.fapi.local
    path: /api/**
    methods: [GET, POST, PUT, DELETE, PATCH]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 600, client_per_min: 300}
    timeout_ms: 15000
