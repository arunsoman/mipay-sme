  # ---- Admin portal (portal.fapi.local): onboarding / user mgmt / permissions.
  # Auth policy is DELEGATED: the MiPay IdP issues + validates the credentials
  # (username/password login, activation, session revocation) and the backend
  # enforces role/authority gates on every endpoint. Specific public auth
  # routes precede the wildcard so the matcher picks them first.
  - host: portal.fapi.local
    path: /api/auth/login
    methods: [POST]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60, client_per_min: 30}
    body_limit: 16384
  - host: portal.fapi.local
    path: /api/auth/otp
    methods: [POST]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60}
  - host: portal.fapi.local
    path: /api/auth/otp/verify
    methods: [POST]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60}
  - host: portal.fapi.local
