server:
  cert: /pki/gateway-server.pem
  key: /pki/gateway-server-key.pem
  client_ca: /pki/client-ca.pem        # partner client certificates (optional at edge)
  context_secret: /pki/ctx-secret
  issuer: https://idp.fapi.local:8443
  max_header_bytes: 32768

upstreams:
  idp:
    base_url: https://idp:8443
    client_cert: /pki/gateway-mesh.pem
    client_key: /pki/gateway-mesh-key.pem
    ca: /pki/platform-ca.pem
    server_name: idp
    forward_dpop: true
  rbac:
    base_url: https://rbac:8443
    client_cert: /pki/gateway-mesh.pem
    client_key: /pki/gateway-mesh-key.pem
    ca: /pki/platform-ca.pem
    server_name: rbac
  # MiPay SME backend (Java): a plain-HTTP mesh member that acts as its own
  # resource server - it validates the bearer tokens its own identity provider
  # (AuthService) issues. The gateway remains the routing/rate-limit/observability
  # policy point for portal traffic; authN/Z is delegated (forward_authorization
  # passes the caller's bearer through untouched).
  mipay:
    base_url: http://backend:8080
    plain_http: true
    forward_authorization: true

rbac_grpc:
  endpoint: rbac:5051
  client_cert: /pki/gateway-mesh.pem
  client_key: /pki/gateway-mesh-key.pem
  ca: /pki/platform-ca.pem
  server_name: rbac
  timeout_ms: 400

introspection:
  enabled: true
  base_url: https://idp:8443
  client_id: gw-resource-server
  assertion_key: /pki/clients/gw-introspect.pem
  cache_ttl_seconds: 3
  timeout_ms: 2000



bff:
  client_id: gateway-bff
  client_key: /pki/clients/gateway-bff.pem
  client_kid: gateway-bff
  idp_base: https://idp:8443
  idp_public_base: https://idp.fapi.local:8443
  db_url: postgres://platform:platform-dev@pg:5432/gateway?sslmode=disable
  abs_life_seconds: 43200   # 12 h
  idle_life_seconds: 1800   # 30 min
limits:
  global_concurrency: 512
  upstream_concurrency: 128
  # reverse proxies in front of the gateway whose X-Real-IP is believed (host nginx /
  # docker bridge). The gateway port is never published beyond loopback, so only these
  # can reach it; everyone else's X-Real-IP is ignored.
  trusted_proxies: ["127.0.0.0/8", "172.16.0.0/12", "10.0.0.0/8", "192.168.0.0/16"]

# Deny-by-default route table. Every route MUST have a policy; unknown
# hosts/paths/methods are rejected by the gateway (404).
routes:
  # ---- IdP endpoints (only public route to the identity plane) ----
  - host: idp.fapi.local
    path: /.well-known/openid-configuration
    methods: [GET]
    upstream: idp
    auth: none
    rate: {ip_per_min: 300}
  - host: idp.fapi.local
    path: /jwks.json
    methods: [GET]
    upstream: idp
    auth: none
    rate: {ip_per_min: 300}
  - host: idp.fapi.local
    path: /healthz
    methods: [GET]
    upstream: idp
    auth: none
    rate: {ip_per_min: 120}
  - host: idp.fapi.local
    path: /authorize
    methods: [GET]
    upstream: idp
    auth: none
    rate: {ip_per_min: 240}
  - host: idp.fapi.local
    path: /login
    methods: [POST]
    upstream: idp
    auth: none
    rate: {ip_per_min: 40}
    body_limit: 8192
  - host: idp.fapi.local
    path: /consent
    methods: [POST]
    upstream: idp
    auth: none
    rate: {ip_per_min: 60}
    body_limit: 8192
  - host: idp.fapi.local
    path: /logout
    methods: [GET, POST]
    upstream: idp
    auth: none
    rate: {ip_per_min: 60}
  - host: idp.fapi.local
    path: /par
    methods: [POST]
    upstream: idp
    auth: none
    rate: {ip_per_min: 60}
    body_limit: 65536
  - host: idp.fapi.local
    path: /token
    methods: [POST]
    upstream: idp
    auth: none
    rate: {ip_per_min: 120}
    body_limit: 65536
  - host: idp.fapi.local
    path: /introspect
    methods: [POST]
    upstream: idp
    auth: none
    rate: {ip_per_min: 120}
  - host: idp.fapi.local
    path: /revoke
    methods: [POST]
    upstream: idp
    auth: none
    rate: {ip_per_min: 60}
    body_limit: 65536

