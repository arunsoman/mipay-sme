    rate: {ip_per_min: 240, client_per_min: 120}
  - host: rbac.fapi.local
    path: /rbac/admin/decisions/{id}
    methods: [GET]
    upstream: rbac
    auth: token
    scopes: [rbac:admin]
    permission: rbac.audit:read
    rate: {ip_per_min: 240, client_per_min: 120}

  # ---- Admin portal (portal.fapi.local): onboarding / user mgmt / permissions.
  # Auth policy is DELEGATED: the MiPay IdP issues + validates the credentials
  # (username/password login, activation, session revocation) and the backend
  # enforces role/authority gates on every endpoint. Specific public auth
  # routes precede the wildcard so the matcher picks them first.
  - host: portal.fapi.local
    path: /api/auth/login
    methods: [POST]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60, client_per_min: 30}
    body_limit: 16384
  - host: portal.fapi.local
    path: /api/auth/otp
    methods: [POST]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60}
  - host: portal.fapi.local
    path: /api/auth/otp/verify
    methods: [POST]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60}
  - host: portal.fapi.local
    path: /api/auth/activate
    methods: [POST]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60}
    body_limit: 16384
  - host: portal.fapi.local
    path: /api/env
    methods: [GET]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 60}
  - host: portal.fapi.local
    path: /api/**
    methods: [GET, POST, PUT, DELETE, PATCH]
    upstream: mipay
    auth: none
    rate: {ip_per_min: 600, client_per_min: 300}
    timeout_ms: 15000

  # P3 core route: verified IdP token + signed context. Portal legacy routes above
  # stay separate until their BFF conversion in P4/P5.
  - host: api.fapi.local
    path: /api/**
    methods: [GET, POST, PUT, DELETE, PATCH]
    upstream: mipay
    auth: token
    scopes: [openid]
    rate: {ip_per_min: 600, client_per_min: 300}
    timeout_ms: 15000
