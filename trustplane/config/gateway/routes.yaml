  - host: rbac.fapi.local
    path: /rbac/admin/reviews
    methods: [POST]
    upstream: rbac
    auth: token
    scopes: [rbac:admin]
    permission: rbac.review:create
    fresh_decision: true
    rate: {ip_per_min: 240, client_per_min: 60}
  - host: rbac.fapi.local
    path: /rbac/admin/reviews/{id}
    methods: [GET]
    upstream: rbac
    auth: token
    scopes: [rbac:admin]
    permission: rbac.review:read
    rate: {ip_per_min: 240, client_per_min: 120}
  - host: rbac.fapi.local
    path: /rbac/admin/reviews/{id}/items/{assignmentId}
    methods: [POST]
    upstream: rbac
