tenants:
  - {id: acme,   name: "Acme Freight GmbH"}
  - {id: globex, name: "Globex Logistics Ltd"}

suppliers:
  - {id: supplier-a, name: "Supplier A (Baltic Cargo)"}
  - {id: supplier-b, name: "Supplier B (Nordic Customs)"}

# user identities (the IdP provisions credentials; this is the platform-side
# identity/org registry)
users:
  - {id: rootadmin, supplier: null,      display_name: "Root Platform Admin", kind: platform}
  - {id: alice,     supplier: null,      display_name: "Alice (platform reviewer)", kind: platform}
  - {id: bob,       supplier: null,      display_name: "Bob (platform maker)", kind: platform}
  - {id: carol,     supplier: null,      display_name: "Carol (globex viewer)", kind: platform}
  - {id: dave,      supplier: null,      display_name: "Dave (acme tenant admin)", kind: platform}
  - {id: saadmin,   supplier: supplier-a, display_name: "Sara (Supplier A admin)", kind: supplier}
  - {id: priya,     supplier: supplier-a, display_name: "Priya (Supplier A member)", kind: supplier}
  - {id: sbadmin,   supplier: supplier-b, display_name: "Sten (Supplier B admin)", kind: supplier}

# NOTE: the CRUD permission catalog is NOT maintained by hand in this file —
# it is automatically picked up at boot from the service controllers
# (@CrudResource annotations -> registry endpoint). Entries listed here only
# exist for readability of role mappings and are idempotent with auto-registry.
permissions:
  - {id: rbac.supplier:read,     description: "List suppliers (auto)"}

# Platform roles — only Root RBAC defines/changes these. supplier_operator is
# the demonstrably DELEGATABLE role in the e2e suite (least-privilege, read-only).
roles:
  - name: platform_admin
    description: "Root platform administrator (suppliers, grants, roles, users)"
    permissions:
      [rbac.supplier:create, rbac.supplier:read, rbac.supplier:update, rbac.supplier:delete,
       rbac.grant:create, rbac.grant:read, rbac.grant:delete,
       rbac.user:create, rbac.user:read, rbac.user:update, rbac.user:delete,
       rbac.assignment:create, rbac.assignment:read, rbac.assignment:delete,
       rbac.role:create, rbac.role:read, rbac.role:update, rbac.role:delete,
       rbac.group:create, rbac.group:read, rbac.group:update, rbac.group:delete,
       rbac.audit:read, rbac.org:sync]
  - name: supplier_admin
    description: "Supplier administrator: own users + assignments within root grants"
    permissions:
      [rbac.user:create, rbac.user:read, rbac.user:update, rbac.user:delete,
       rbac.assignment:create, rbac.assignment:read, rbac.assignment:delete,
       rbac.group:create, rbac.group:read, rbac.group:update, rbac.group:delete,
       rbac.audit:read]
  - name: supplier_operator
    description: "Delegable least-privilege role: read-only operational access"
    permissions: [rbac.user:read, rbac.assignment:read, rbac.audit:read]
  - name: tenant_operator
    description: "Delegable tenant-scoped operational role"
    permissions: [rbac.user:read, rbac.assignment:read]

# Direct (platform-authored) assignments — these do NOT need a grant
assignments:
  - {subject: rootadmin, role: platform_admin,  tenant: null,    scope: all}
  - {subject: saadmin,   role: supplier_admin,  tenant: null,    scope: all}
  - {subject: sbadmin,   role: supplier_admin,  tenant: null,    scope: all}
  - {subject: bob,   role: supplier_operator, tenant: acme, scope: all}  # direct platform assignment (no grant needed)
# alice, carol, dave intentionally start with NO assignments — the suite
# proves that a valid token without a root-backed assignment is powerless.

# The org tree (org_closure + org_tenant_mapping) is not seeded: the MiPay backend
# pushes its real closure table to /rbac/internal/orgs/sync at boot (§9.2).
