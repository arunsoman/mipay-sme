# ==============================================================================
# RBAC Fixtures — demo org tree + assignments for e2e suite
# Loaded ONLY when RBAC_ENVIRONMENT is dev or sandbox
# Only 'orgs' and 'assignments' sections are processed by SchemaAndSeed.java;
# the permission catalogue is seeded through the admin APIs.
# ==============================================================================

# ---------------------------------------------------------------------------
# 1) Demo org tree (orgs + closure)
#    Ids are prefixed e2e- and marked source=fixture so the core's org-tree
#    sync never touches them.  Mirrors the worked example of
#    fapi2-design.md G.7.
# ---------------------------------------------------------------------------

orgs:
  - {id: e2e-platform, name: "E2E Platform Root", type: PLATFORM}
  - {id: e2e-namib,    name: "E2E Namib Distribution", type: DISTRIBUTOR, parent: e2e-platform}
  - {id: e2e-oka,      name: "E2E Okahandja Fresh Market", type: MERCHANT, parent: e2e-namib}
  - {id: e2e-kav,      name: "E2E Kavango Wholesale", type: DISTRIBUTOR, parent: e2e-platform}
  - {id: e2e-sib,      name: "E2E Rundu Corner Shop", type: MERCHANT, parent: e2e-kav}

assignments:
  # Platform root admin assigned to the platform root (scope all)
  - {subject: uadmin2, role: platform_user_admin, tenant: e2e-platform, scope: all}
  # Org admin for the platform root
  - {subject: alice, role: platform_user_admin, tenant: e2e-platform, scope: own}
  # Org staff for the platform root
  - {subject: selma, role: org_staff, tenant: e2e-platform, scope: own}
  # Merchant org admin
  - {subject: tomas, role: platform_user_admin, tenant: e2e-namib, scope: own}
  # Distributor org admin (subtree scope)
  - {subject: jonas, role: platform_user_admin, tenant: e2e-platform, scope: subtree}
  # Merchant staff
  - {subject: carol, role: org_staff, tenant: e2e-namib, scope: own}

# ---------------------------------------------------------------------------
# 2) Mock data for the e2e fapi-client tests
#    These subjects are the uids of the IdP seed accounts (IDP_SEED_USERS).
# ---------------------------------------------------------------------------

users:
  - {uid: rootadmin, password: rootadmin-pw, scopes: openid|uadmin2|uadmin, role: platform_user_admin, tenant: e2e-platform}
  - {uid: uadmin2, password: uadmin2-pw, scopes: openid, role: platform_user_admin, tenant: e2e-platform}
  - {uid: alice, password: alice-pw, scopes: openid, role: org_staff, tenant: e2e-platform}
  - {uid: selma, password: selma-pw, scopes: openid, role: org_staff, tenant: e2e-platform}
  - {uid: tomas, password: tomas-pw, scopes: openid, role: platform_user_admin, tenant: e2e-namib}
  - {uid: mira, password: mira-pw, scopes: openid, role: org_staff, tenant: e2e-namib}