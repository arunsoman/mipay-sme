# Demo orgs and assignments for the e2e suite (cmd/fapi-client). Loaded ONLY when
# RBAC_ENVIRONMENT is dev or sandbox. Subjects are the uids of the IdP seed accounts
# (IDP_SEED_USERS). Org ids are prefixed e2e- and marked source=fixture, so the core's
# org-tree sync never touches them. The tree mirrors the worked example of
# docs/plans/fapi2-design.md G.7.
orgs:
  - {id: e2e-platform, name: "E2E Platform Root", type: PLATFORM}
  - {id: e2e-namib,    name: "E2E Namib Distribution", type: DISTRIBUTOR, parent: e2e-platform}
  - {id: e2e-oka,      name: "E2E Okahandja Fresh Market", type: MERCHANT, parent: e2e-namib}
  - {id: e2e-kav,      name: "E2E Kavango Wholesale", type: DISTRIBUTOR, parent: e2e-platform}
  - {id: e2e-sib,      name: "E2E Rundu Corner Shop", type: MERCHANT, parent: e2e-kav}

assignments: []   # 2026-11-12: every role but organization_root deleted; users get org-defined roles
